name: BodaConnect CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ══════════════════════════════════════
  # JOB 1 — Run API Tests
  # ══════════════════════════════════════
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodadb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      mqtt:
        image: eclipse-mosquitto
        ports:
          - 1883:1883

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start CI measurement timer
        run: |
          echo "PIPELINE_START=$(date +%s)" >> $GITHUB_ENV
          mkdir -p reports

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write Mosquitto config for CI
        run: |
          mkdir -p mosquitto/config
          echo "listener 1883" > mosquitto/config/mosquitto.conf
          echo "allow_anonymous true" >> mosquitto/config/mosquitto.conf

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend server
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: bodadb
          MQTT_HOST: 127.0.0.1
          MQTT_PORT: 1883
        run: node server.js &

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in {1..20}; do
            curl -s http://localhost:5000/ && break
            echo "Attempt $i failed, retrying..."
            sleep 3
          done

      - name: Run API tests
        id: api_tests
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p ../reports
          npm test 2>&1 | tee ../reports/api-test-output.txt

      - name: Verify MQTT broker is running
        id: mqtt_health
        if: always()
        continue-on-error: true
        run: |
          echo "Checking MQTT status..."
          curl -fsS http://localhost:5000/mqtt/status | tee reports/mqtt-status.json

      - name: Save CI measurement report
        if: always()
        run: |
          END=$(date +%s)
          DURATION=$((END - PIPELINE_START))
          cat > reports/ci-metrics.md <<EOF
          # BodaConnect CI Measurement Report

          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow run: ${{ github.run_id }}
          Total test job time: ${DURATION} seconds
          API test result: ${{ steps.api_tests.outcome }}
          MQTT health result: ${{ steps.mqtt_health.outcome }}

          Baseline metrics captured for CS 421 Assignment 4:
          - Build/test duration
          - Test success or failure
          - MQTT broker health
          - Commit and workflow traceability
          EOF
          cat reports/ci-metrics.md

      - name: Upload CI measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-measurement-report
          path: |
            reports/ci-metrics.md
            reports/api-test-output.txt
            reports/mqtt-status.json

      - name: Fail if API tests failed
        if: steps.api_tests.outcome != 'success'
        run: exit 1


  # ══════════════════════════════════════
  # JOB 2 — Build, Tag and Push to Docker Hub
  # ══════════════════════════════════════
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start build measurement timer
        run: |
          echo "BUILD_PUSH_START=$(date +%s)" >> $GITHUB_ENV
          mkdir -p reports

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version tags
        id: version
        run: |
          echo "VERSION=v1.0" >> $GITHUB_OUTPUT
          echo "SHA_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "REPO=${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.SHA_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.DATE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.SHA_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.DATE_TAG }}

      - name: Confirm images pushed to Docker Hub
        run: |
          echo "================================================"
          echo "  IMAGES PUSHED TO DOCKER HUB SUCCESSFULLY"
          echo "================================================"
          echo "  Backend:"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:latest"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.VERSION }}"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.SHA_TAG }}"
          echo ""
          echo "  Frontend:"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:latest"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.VERSION }}"
          echo "    ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.SHA_TAG }}"
          echo "================================================"

      - name: Save push report
        run: |
          mkdir -p reports
          echo "DOCKER HUB PUSH REPORT" > reports/dockerhub-push.txt
          echo "======================" >> reports/dockerhub-push.txt
          echo "Status    : SUCCESS" >> reports/dockerhub-push.txt
          echo "Date      : $(date)" >> reports/dockerhub-push.txt
          echo "Commit    : ${{ github.sha }}" >> reports/dockerhub-push.txt
          echo "Version   : ${{ steps.version.outputs.VERSION }}" >> reports/dockerhub-push.txt
          echo "" >> reports/dockerhub-push.txt
          echo "Images pushed:" >> reports/dockerhub-push.txt
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:latest" >> reports/dockerhub-push.txt
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.VERSION }}" >> reports/dockerhub-push.txt
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:latest" >> reports/dockerhub-push.txt
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.VERSION }}" >> reports/dockerhub-push.txt
          cat reports/dockerhub-push.txt

      - name: Upload push report
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-push-report
          path: reports/dockerhub-push.txt

      - name: Save build measurement report
        if: always()
        run: |
          END=$(date +%s)
          DURATION=$((END - BUILD_PUSH_START))
          cat > reports/build-metrics.md <<EOF
          # BodaConnect Build and Push Measurement Report

          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow run: ${{ github.run_id }}
          Build and Docker Hub push time: ${DURATION} seconds
          Backend image tag: ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-backend:${{ steps.version.outputs.SHA_TAG }}
          Frontend image tag: ${{ secrets.DOCKERHUB_USERNAME }}/bodaconnect-frontend:${{ steps.version.outputs.SHA_TAG }}
          EOF
          cat reports/build-metrics.md

      - name: Upload build measurement artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-measurement-report
          path: reports/build-metrics.md
